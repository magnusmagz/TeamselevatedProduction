[build]
  base = "frontend"
  command = "CI=false npm run build"
  publish = "build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  # Disable secrets scanning because Google Maps API keys are client-side
  # and must be bundled into the JavaScript. Protected by domain restrictions
  # on Google Cloud Console instead.
  SECRETS_SCAN_ENABLED = "false"
