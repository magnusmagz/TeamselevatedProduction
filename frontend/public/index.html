<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12443e" />
    <meta name="description" content="Teams Elevated - Sports Club Management Platform" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Teams Elevated" />
    <meta name="application-name" content="Teams Elevated" />
    <meta name="msapplication-TileColor" content="#12443e" />
    <meta name="msapplication-config" content="none" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.svg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-152x152.svg" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Teams Elevated</title>

    <!-- Google Fonts - Orbitron for preview -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Google Maps Web Components -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.11/index.min.js"></script>

    <!-- iOS Splash Screens -->
    <style>
      /* Safe area insets for notched devices */
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <!-- Google Maps API Loader - API key injected at build time -->
    <gmpx-api-loader key="%REACT_APP_GOOGLE_MAPS_API_KEY%" solution-channel="GMP_GE_mapsandplacesautocomplete_v2"></gmpx-api-loader>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
